# Legacy mod mechanism catalog (docs/prd/legacy-mod-compatibility.md §3.1).
#
# The machine-readable home of the dispositions (LMC-CLS-006). The PRD's §3.1
# tables are GENERATED from this file by scripts/check-lmc-catalog.py; edit
# here, then run `scripts/check-lmc-catalog.py --write`. Nothing in the PRD's
# tables is maintained by hand.
#
# Rules (LMC-CLS-001, -005):
# - one disposition per mechanism per game; a mechanism that has components
#   with different dispositions (the extender binary and the facilities it
#   provides) is split into component entries ("N1.facilities", "N1.binary");
# - `games` lists the games the mechanism exists for, as the PRD states them;
#   a game absent from it has no such mechanism (not a D3);
# - `disposition` is the CURRENT disposition; `target`, when present, is the
#   one the mechanism is promoted to (S3 per construct);
# - `per_game` overrides `disposition` for one game, with its own reason;
# - every entry has a `reason`, at least one `citation`, and a `version`
#   that is bumped, with the citation updated, on any disposition change;
# - `verify` lists the Phase 0 questions still open for the entry. An entry
#   with `verify` is a starting position, not a confirmed one.
#
# Dispositions: D1 works, D2 redundant, D3 not applicable, D4 port / served by
# an engine service, D5 unsupported and tracked.
