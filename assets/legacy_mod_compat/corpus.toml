# Legacy mod conformance corpus (docs/prd/legacy-mod-compatibility.md §7.2, §7.3).
#
# The candidate mods the conformance runner measures, with where to get them.
# No mod file is ever checked in (LMC-LEGAL-001): each entry is a link, and the
# mods are downloaded by hand into a local, opt-in profile.
#
# Checked by scripts/check-lmc-catalog.py (C10–C13) against mechanisms.toml:
# every mechanism a mod names must exist in the catalog for the mod's game.
#
# Fields:
# - `id`          stable corpus id, `<game>-<slug>`
# - `game`        a catalog game
# - `url`         the canonical download page (Nexus, GitHub, ModDB, official site)
# - `kind`        plugin | assets | native | scripts | ui | tool | total-conversion
#                 (the main file; `native` = extender DLL, never loaded, reported)
# - `mechanisms`  the §3.1 mechanisms the mod exercises (catalog ids)
# - `tranche`     install order: 1 = content only (records, assets, ObScript /
#                 Papyrus without an extender), 2 = needs extender, library or
#                 UI services, or is native code to report (D2/D3/D4), 3 = tool
#                 outputs and total conversions
# - `status`      candidate = the link was found; verified = installed, the
#                 mechanisms confirmed from its files, the licence read, and an
#                 acceptance scenario written (§7.3 rule 3)
# - `evidence`    how the link was confirmed, with the date
# - `requires`    masters and mods it depends on, as far as the sources showed
# - `licence`     the permissions summary; required once verified
# - `scenario`    the §7.3 acceptance scenario; required once verified
# - `notes`       anything that affects whether the entry stays in the corpus
#
# Nexus refused automated page fetches when this list was written (2026-11-22),
# so no Nexus permissions panel was read; "step wiki" evidence means the
# stepmodifications.org page names the same Nexus id, a second source.
corpus_version = 1

