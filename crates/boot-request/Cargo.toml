[package]
name = "byroredux-boot-request"
version.workspace = true
edition.workspace = true

# The launcher/engine handoff contract. Deliberately dependency-free beyond
# serde + toml at the application level; the shared durability helper comes
# from `byroredux-core`, which stays renderer/GPU-free so the launcher can
# still build and run without a Vulkan device.
[dependencies]
byroredux-core = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
