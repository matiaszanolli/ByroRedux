[package]
name = "byroredux-ui"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
flate2 = { workspace = true }
byroredux-bsa = { workspace = true }

# Ruffle — Rust Flash player (git, pinned to nightly-2026-10-10)
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", rev = "2edfd97d11897e6cf6301c30cd87e86d774919c1", default-features = false }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", rev = "2edfd97d11897e6cf6301c30cd87e86d774919c1" }
ruffle_video_software = { git = "https://github.com/ruffle-rs/ruffle", rev = "2edfd97d11897e6cf6301c30cd87e86d774919c1" }
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "2edfd97d11897e6cf6301c30cd87e86d774919c1" }

# wgpu (re-exported by ruffle_render_wgpu, but needed for type references)
wgpu = "30"

# Async executor for wgpu device creation
async-channel = "2"
futures = "0.3"
url = "2"

# Image types (RgbaImage from capture_frame)

# Error handling
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
byroredux-plugin = { workspace = true }
