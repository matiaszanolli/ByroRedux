[package]
name = "byroredux-fsr3-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "byroredux_fsr3"
build = "build.rs"

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
ash = { workspace = true }

# cargo-machete false positive (#5851): `cc` is a [build-dependencies]
# entry consumed from build.rs, which --with-metadata's source scan does
# not read.
[package.metadata.cargo-machete]
ignored = ["cc"]
