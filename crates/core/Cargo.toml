[package]
name = "byroredux-core"
version.workspace = true
edition.workspace = true

[features]
default = ["parallel-scheduler"]
parallel-scheduler = ["rayon"]
inspect = ["serde", "serde_json", "glam/serde"]
# Save/load (M45) reuses the same serde derives as `inspect`; kept as a
# distinct feature name so the save crate can opt in without implying the
# debug-inspection intent.
save = ["inspect"]

[dependencies]
glam = { workspace = true }
log = { workspace = true }
rayon = { workspace = true, optional = true }
# #2923 — FxHashMap/FxHashSet for the per-frame skinning maps in
# `ecs/resources/skin_slot_pool.rs`. Same rationale as #1368 / #2174 in
# `crates/renderer`: SipHash-1-3 is the wrong default for maps probed
# once per entity per frame.
rustc-hash = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
string-interner = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
