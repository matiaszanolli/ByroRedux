[package]
name = "byroredux-xwma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "byroredux_ffmpeg"

[build-dependencies]
cc.workspace = true
# The pinned FFmpeg tarball is checked against its SHA-256 before it is unpacked (build.rs).
sha2 = "0.10"

[dev-dependencies]
byroredux-bsa.workspace = true
rayon.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# cargo-machete false positive (#5851): `cc` is a [build-dependencies]
# entry consumed from build.rs, which --with-metadata's source scan does
# not read.
[package.metadata.cargo-machete]
ignored = ["cc"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
