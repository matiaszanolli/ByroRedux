[package]
name = "byroredux-debug-server"
version.workspace = true
edition.workspace = true

[dependencies]
byroredux-core = { workspace = true, features = ["inspect"] }
byroredux-papyrus = { workspace = true }
# PERK-DX-006 — `SpellList` (the actor's spells) is a scripting-crate component; its serde derives are the
# `save` feature's, which the binary turns on anyway.
byroredux-scripting = { workspace = true, features = ["save"] }
byroredux-debug-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
