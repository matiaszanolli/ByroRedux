[package]
name = "byroredux-video"
version.workspace = true
edition.workspace = true

# Movie decoding for the games' own Bink videos (PRD bink-video-playback). Bink 1 (BIKi) video and
# audio are decoded in process by `mercs2_bink` (MIT, pure Rust, no dependencies), so players need
# no external tool (BIK-DEC-005); Bink 2 (KB2g, KB2j) video and audio by the workspace's clean-room
# `byroredux-bink2` and `byroredux-binkaudio` (BIK-DEC-003).
[dependencies]
mercs2_bink = "=0.1.0"
byroredux-bink2 = { workspace = true }
byroredux-binkaudio = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
