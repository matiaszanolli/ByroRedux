name: Playable Smoke Gates

on:
  workflow_dispatch:
    inputs:
      game:
        description: Title to gate (#3039 — the gates are game-parameterised)
        required: true
        default: skyrim_se
        type: choice
        options:
          - skyrim_se
          - fnv
          - fo3
          - fo4
          - oblivion
      gate:
        description: Gate to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - p0-door-interaction
          - p1-character-traversal
          - p2-melee-core
          - w1-water-traversal
          - m-exteriors-static
          - groundcover-eval

jobs:
  smoke:
    name: ${{ inputs.game }} / ${{ inputs.gate }}
    runs-on: [self-hosted, linux, x64, byroredux-game-data]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build smoke binaries
        run: cargo build --release -p byroredux -p byro-dbg
      - name: Run requested gate
        env:
          GAME: ${{ inputs.game }}
          BYROREDUX_SKYRIM_DATA: ${{ vars.BYROREDUX_SKYRIM_DATA }}
          BYROREDUX_FNV_DATA: ${{ vars.BYROREDUX_FNV_DATA }}
          BYROREDUX_FO3_DATA: ${{ vars.BYROREDUX_FO3_DATA }}
          BYROREDUX_FO4_DATA: ${{ vars.BYROREDUX_FO4_DATA }}
          BYROREDUX_OBLIVION_DATA: ${{ vars.BYROREDUX_OBLIVION_DATA }}
        run: |
          run_gate() {
            local gate="$1"; shift
            set +e
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
              "docs/smoke-tests/$gate.sh" "$@"
            local status=$?
            set -e
            if (( status == 77 )); then
              echo "::error::$gate skipped because $GAME data is unavailable"
              exit 1
            fi
            return "$status"
          }
          # The `all` bundle must respect each fixture's declared routes
          # (#4547): fixtures/oblivion.env declares only p0, so a blanket
          # run_gate of p1/p2 would exit 2 (unmeasured route) and go red
          # forever. Undeclared gates skip with a notice, never silently.
          # A fixture WITHOUT FIXTURE_GATES supports every gate — the same
          # semantics scripts/check-playable-smoke-contracts.sh uses.
          run_declared_gate() {
            local gate="$1"; shift
            local fixture="docs/smoke-tests/fixtures/$GAME.env"
            if [[ -f "$fixture" ]]; then
              # shellcheck disable=SC1090
              source "$fixture" >/dev/null 2>&1 || true
            fi
            if [[ -n "${FIXTURE_GATES[@]+x}" ]]; then
              local declared found=0
              for declared in "${FIXTURE_GATES[@]}"; do
                [[ "$declared" == "$gate" ]] && found=1
              done
              if (( found == 0 )); then
                echo "::notice::$gate is not a measured route for $GAME (fixtures/$GAME.env FIXTURE_GATES) — skipped"
                return 0
              fi
            fi
            run_gate "$gate" "$@"
          }

          case "${{ inputs.gate }}" in
            all)
              run_declared_gate p0-door-interaction "$GAME"
              run_declared_gate p1-character-traversal "$GAME"
              run_declared_gate p2-melee-core "$GAME"
              ;;
            # EXT-D7-2026-09-19-05 / #4492 — the exterior harnesses see GPU
            # output that no cargo-test lane can. m-exteriors.sh takes the
            # profile as argv[1] and the mode as argv[2], and names its
            # Skyrim profile `skyrim`, not `skyrim_se`.
            m-exteriors-static)
              ext_game="$GAME"
              if [[ "$ext_game" == skyrim_se ]]; then ext_game=skyrim; fi
              # run_gate appends `.sh` itself — passing `m-exteriors.sh`
              # here made CI execute docs/smoke-tests/m-exteriors.sh.sh,
              # a path that never exists (EXT-D7-2026-09-21-01 / #4730),
              # so every dispatch of the exterior matrix measured nothing.
              run_gate m-exteriors "$ext_game" static
              ;;
            # The ground-cover eval is not game-parameterised: its four
            # reference cases pin one FNV and one Skyrim pose each
            # (EXAL §11.5). One X server wraps the whole script the same way
            # scripts/material-provider-matrix.sh is driven in
            # rt-correctness.yml.
            groundcover-eval)
              set +e
              xvfb-run -a --server-args="-screen 0 1280x720x24" \
                scripts/renderer-eval-groundcover.sh
              status=$?
              set -e
              if (( status == 77 )); then
                echo "::error::renderer-eval-groundcover skipped because game data is unavailable"
                exit 1
              fi
              exit "$status"
              ;;
            *) run_gate "${{ inputs.gate }}" "$GAME" ;;
          esac
      - name: Publish groundcover references
        if: always() && inputs.gate == 'groundcover-eval'
        uses: actions/upload-artifact@v4
        with:
          name: renderer-eval-groundcover-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/renderer-eval-groundcover
          if-no-files-found: error
          retention-days: 30
