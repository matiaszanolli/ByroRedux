name: RT Correctness Gates

# MANUAL-ONLY: this repository has no registered runner with the `byroredux-rt`
# label (`gh api repos/<repo>/actions/runners` reports 0). #5854 had scheduled
# the golden-frame lane nightly; with no runner every scheduled run sat queued
# for 24 h and was cancelled, so no nightly golden result ever existed and the
# queue only grew (#6182). Run the gates locally on the RT dev box — `/audit-runtime`
# lists the exact commands — and re-add a `schedule:` only after a runner is
# registered.
on:
  workflow_dispatch:
    inputs:
      gate:
        description: Hardware correctness gate to execute
        required: true
        default: cornell
        type: choice
        options:
          - cornell
          - golden
          - material-provider-matrix
          - all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cornell:
    name: Cornell L0-L5 oracle
    if: inputs.gate == 'cornell' || inputs.gate == 'all'
    runs-on: [self-hosted, linux, x64, byroredux-rt]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # #5308 / #5478 — rust-toolchain.toml pins 1.96.0 and overrides
      # this step inside the checkout; naming the same toolchain here
      # keeps the version output truthful instead of installing an
      # unused stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build renderer oracle
        run: cargo build --release -p byroredux --bin byroredux
      - name: Record runner provenance
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/target/rt-correctness-artifacts
        run: |
          mkdir -p "$ARTIFACT_DIR"
          git rev-parse HEAD > "$ARTIFACT_DIR/revision.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$ARTIFACT_DIR/timestamp-utc.txt"
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader \
            > "$ARTIFACT_DIR/gpu.txt" 2>&1 || true
          vulkaninfo --summary > "$ARTIFACT_DIR/vulkan-summary.txt" 2>&1 || true
      - name: Run serialized hardware oracle
        env:
          BYROREDUX_RT_ARTIFACT_DIR: ${{ github.workspace }}/target/rt-correctness-artifacts
        run: xvfb-run -a cargo test --release -p byroredux --test cornell_rt_oracle -- --ignored --nocapture --test-threads=1
      - name: Build artifact manifest
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/target/rt-correctness-artifacts
        run: |
          if [[ -d "$ARTIFACT_DIR" ]]; then
            find "$ARTIFACT_DIR" -type f ! -name sha256sums.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > "$ARTIFACT_DIR/sha256sums.txt"
          fi
      - name: Publish Cornell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cornell-rt-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rt-correctness-artifacts
          if-no-files-found: error
          retention-days: 30

  golden:
    name: Golden frames + FSR upscaler quality
    if: inputs.gate == 'golden' || inputs.gate == 'all'
    runs-on: [self-hosted, linux, x64, byroredux-rt]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # #5308 / #5478 — rust-toolchain.toml pins 1.96.0 and overrides
      # this step inside the checkout; naming the same toolchain here
      # keeps the version output truthful instead of installing an
      # unused stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      # #5625 — the only pixel-level render regression guards are
      # `#[ignore]` behind a Vulkan device; nothing ran them until now.
      # The game-data `fsr_presets_on_game_content_report_only` case is
      # left out: it needs BYROREDUX_QUALITY_GAME and only reports.
      - name: Run golden frames
        run: xvfb-run -a cargo test --release -p byroredux --test golden_frames -- --ignored --nocapture --test-threads=1
      - name: Run FSR preset quality gate
        run: xvfb-run -a cargo test --release -p byroredux --test upscaler_quality -- --ignored --nocapture --test-threads=1 fsr_presets_track_the_native_reference

  material-provider-matrix:
    name: Five-game material provider matrix
    if: inputs.gate == 'material-provider-matrix' || inputs.gate == 'all'
    runs-on: [self-hosted, linux, x64, byroredux-rt, byroredux-game-data]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # #5308 / #5478 — rust-toolchain.toml pins 1.96.0 and overrides
      # this step inside the checkout; naming the same toolchain here
      # keeps the version output truthful instead of installing an
      # unused stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build engine and debugger
        run: cargo build --release -p byroredux -p byro-dbg
      - name: Run provider-backed matrix
        env:
          BYROREDUX_GAMES_ROOT: ${{ vars.BYROREDUX_GAMES_ROOT }}
          BYROREDUX_MATERIAL_MATRIX_OUT: ${{ github.workspace }}/target/material-provider-matrix
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" bash -c 'scripts/material-provider-matrix.sh 3 30'
      - name: Publish material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-provider-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/material-provider-matrix
          if-no-files-found: error
          retention-days: 30
