name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  issue-traceability:
    name: Issue/commit traceability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a closing-keyword commit for every issue closed by the PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-issue-traceability.sh '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'

  source-integrity:
    name: Text-source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject grep-blinding NUL bytes
        run: scripts/check-text-source-integrity.sh

  playable-smoke-contracts:
    name: Playable smoke gate contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invoke every playable smoke gate without game data
        run: scripts/check-playable-smoke-contracts.sh

  # ──────────────────────────────────────────────────────────────────────────
  # Offline shader source/artifact parity
  #
  # Shader modules are committed and embedded with include_bytes!, so ordinary
  # Rust builds never prove that the checked-in GLSL still compiles to the
  # shipped SPIR-V. Keep the compiler version exact: SPIR-V code generation is
  # version-dependent, and a compile-only check would miss a binary produced
  # from uncommitted source.
  # ──────────────────────────────────────────────────────────────────────────
  shader-artifacts:
    name: Shader source/artifact parity
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install checkout + shader tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            glslang-tools \
            ripgrep
      - uses: actions/checkout@v4
      - name: Recompile and compare every first-party shader
        run: scripts/check-shader-artifacts.sh
      # #2835 — the bench archives are read by hand, so nothing else catches a
      # report script that crashes on its own committed TSV schema.
      - name: FSR bench report reads both TSV schemas
        run: python3 scripts/fsr_bench_report.py --self-test

  # ──────────────────────────────────────────────────────────────────────────
  # Standard checks — no GPU required
  # ──────────────────────────────────────────────────────────────────────────
  cargo-test:
    name: Test + Check + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2-dev libvulkan-dev
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # Global ABBA lock-order detector (TS-02 / #313 / #1410)
  #
  # Re-runs the test suite with BYRO_LOCK_ORDER_CHECK=1 so the process-wide
  # lock-order graph in crates/core/src/ecs/lock_tracker.rs is active. Any two
  # threads that acquire the same pair of RwLocks in opposite orders (the ABBA
  # deadlock pattern that invariant #4 forbids) panic the owning test. The
  # default feature set keeps `parallel-scheduler` on, so the detector observes
  # real cross-thread acquisitions. Runs as its own job (parallel with
  # cargo-test) to keep the detector signal isolated from the functional
  # test signal.
  # ──────────────────────────────────────────────────────────────────────────
  lock-order-check:
    name: ABBA lock-order detector
    runs-on: ubuntu-latest
    env:
      BYRO_LOCK_ORDER_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2-dev libvulkan-dev
      - name: cargo test (lock-order detector enabled)
        run: cargo test --workspace

  # ──────────────────────────────────────────────────────────────────────────
  # ECS cached-pointer aliasing under Stacked Borrows (SAFE-2026-08-03-01 / #2271)
  #
  # QueryRead/QueryWrite/ComponentRef (crates/core/src/ecs/query.rs) each cache
  # a raw pointer resolved once from a held RwLock guard, then deref it in the
  # hot path without re-touching the guard (#1367). The soundness argument —
  # the guard field is never re-borrowed after construction — is a convention
  # the type system does not enforce; a future method that read `self.guard`
  # post-construction would silently invalidate the cached pointer's Stacked
  # Borrows tag while still compiling and passing a normal `cargo test`. Miri
  # is the only tool that actually checks that invariant.
  #
  # Scoped to `ecs::world::tests` — the module that constructs and exercises
  # QueryRead/QueryWrite/ComponentRef end to end (spawn/insert/query/get,
  # including the dedicated #1367 cached-storage regression tests) — rather
  # than the whole workspace or even the whole crate: `resource_visible_to_
  # system_via_scheduler` is the one test in that module that drives
  # `Scheduler::run`, and rayon's cross-thread work-stealing goes through
  # crossbeam-epoch's platform thread-local pinning, which Miri's concurrency
  # model does not support. That test exercises the scheduler, not the
  # cached-pointer contract this job checks, so it is skipped here rather
  # than skipping Miri coverage for the module entirely.
  # ──────────────────────────────────────────────────────────────────────────
  ecs-query-miri:
    name: ECS cached-pointer aliasing (Miri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: cargo miri setup
        run: cargo miri setup
      - name: cargo miri test (ecs::world::tests, scheduler test excluded)
        run: cargo miri test -p byroredux-core --lib ecs::world::tests -- --skip resource_visible_to_system_via_scheduler

  # ──────────────────────────────────────────────────────────────────────────
  # NIF heap-allocation regression (TD9-001 / #1247 / #1381 / #1763)
  #
  # `heap_allocation_bounds` (+ its sibling `heap_allocation_bounds_geometry`,
  # #1381 / PERF-D2-NEW-03) pin the NIF-PERF-01/02/03 (#832/#833/#831) + #408
  # allocation-hygiene fixes by parsing synthetic NIFs inside a
  # `dhat::Profiler` scope and asserting upper bounds on block count + byte
  # total. Gated on the opt-in `dhat-heap` feature (installs a
  # `#[global_allocator]`), so the default `cargo test --workspace` job above
  # never runs them. Runs as its own job — dhat's global-allocator override
  # must not share a process with the rest of the suite. The three files are
  # separate test binaries (dhat's profiler is a process-global singleton),
  # so each `--test` runs as its own process — list all three explicitly rather
  # than a bare `cargo test -p byroredux-nif --features dhat-heap`, which
  # would also re-run every non-dhat integration test in the crate.
  # ──────────────────────────────────────────────────────────────────────────
  nif-heap-allocation-bounds:
    name: NIF heap-allocation regression (dhat-heap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (dhat-heap)
        run: |
          cargo test -p byroredux-nif --features dhat-heap --test heap_allocation_bounds
          cargo test -p byroredux-nif --features dhat-heap --test heap_allocation_bounds_geometry
          cargo test -p byroredux-nif --features dhat-heap --test heap_allocation_bounds_import

  # ──────────────────────────────────────────────────────────────────────────
  # Vulkan validation layer headless bench (VKC-006 / #1429)
  #
  # Uses Mesa lavapipe (software Vulkan) so no GPU is required.
  # VK_LAYER_KHRONOS_validation is enabled; the debug messenger callback in
  # crates/renderer/src/vulkan/debug.rs routes ERROR-severity validation
  # messages to log::error!("[Vulkan] ..."). Any such message in the output
  # fails this job.
  #
  # RT extensions (VK_KHR_acceleration_structure + VK_KHR_ray_query) are
  # detected at runtime; the engine runs in non-RT mode when lavapipe does
  # not expose them. A GPU-enabled self-hosted runner would exercise the full
  # RT path.
  # ──────────────────────────────────────────────────────────────────────────
  vulkan-validation:
    name: Vulkan validation layers (lavapipe)
    runs-on: ubuntu-24.04
    env:
      # #2137 / CONC-D4-NEW-01 — this is the only CI job that boots the real
      # engine, so it is the only place rayon dispatches the parallel batch
      # across worker threads against a real loaded world: exactly the
      # workload the cross-thread lock-order graph was built for. Without
      # this the detector is compiled in (debug profile) but inert, because
      # `ENABLED` is a `LazyLock<AtomicBool>` seeded from the environment at
      # first touch (crates/core/src/ecs/lock_tracker.rs). Cost is negligible
      # for a 5-frame run.
      BYRO_LOCK_ORDER_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Mesa lavapipe + Vulkan validation layers + xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            libvulkan-dev \
            libasound2-dev \
            xvfb

      - name: Build debug binary
        run: cargo build -p byroredux

      - name: Run 5-frame bench under VK_LAYER_KHRONOS_validation
        run: |
          # Route validation layer to lavapipe (CPU Vulkan — no GPU needed).
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          # Only capture error-level messages; every [Vulkan] line at this
          # level is a real validation error from the debug messenger callback.
          export RUST_LOG=error

          # xvfb-run provides the display winit needs.
          # --bench-frames exits after N rendered frames (no --bench-hold).
          # Allow non-zero exit (no suitable device → engine bails cleanly),
          # but keep the real status instead of discarding it with `|| true`.
          set +e
          OUTPUT=$(xvfb-run --auto-servernum \
            cargo run -p byroredux -- --bench-frames 5 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          echo "bench exit status: $STATUS"

          # Fail if the Vulkan debug messenger fired any ERROR-severity callback.
          if echo "$OUTPUT" | grep -qF '[Vulkan]'; then
            echo ""
            echo "Vulkan validation errors detected (see [Vulkan] lines above)."
            exit 1
          fi

          # #2138 / CONC-D4-NEW-02 — a tripped assertion panics with text that
          # contains no '[Vulkan]' marker, and the old `|| true` discarded the
          # exit code, so the job went green on a tripped guard. Two live
          # families reach this job and only this job: the BYRO_LOCK_ORDER_CHECK
          # detector enabled above, and the #1394/#1602 scheduler-access
          # debug_asserts in boot.rs::install_runtime_registries. Match the
          # panic text rather than any non-zero status — that would also catch
          # the legitimate "no suitable device" bail — and match on output
          # rather than the status alone, since a panic on a rayon worker
          # thread still prints here whatever the process exit code ends up as.
          if echo "$OUTPUT" | grep -qF 'panicked at'; then
            echo ""
            echo "Engine panicked during the bench run (see 'panicked at' above)."
            exit 1
          fi

      - name: Assert renderer-static scene-state determinism
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          BYROREDUX_BENCH_RUNNER: xvfb-run --auto-servernum
        run: scripts/check-bench-determinism.sh target/debug/byroredux 5
