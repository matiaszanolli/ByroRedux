name: Real-data corpus gates

# #3919 — `ci.yml` runs `cargo test --workspace`, which never executes an
# `#[ignore]`d test, and the three NIF corpus harnesses that catch a vanilla-
# content parse regression (`parse_real_nifs`, `per_block_baselines`,
# `block_coverage_baselines`) are all `#[ignore]`d because they need game data.
# #3918 dropped 296 `NiSkinPartition` blocks across two shipped titles and sat
# on `main` for two days with CI green; the gate that would have named the
# exact block and delta was never invoked. This lane runs those harnesses
# nightly on the self-hosted runner that carries game data, one job per title
# so a red result names the game, with `BYROREDUX_REQUIRE_GAME_DATA=1` (#3850)
# so an absent corpus is a failed job rather than a silent `ok`, and a post-run
# check that the title's filter matched at least one test.
#
# #4659 — the `parsers` job generalises the same gate to the non-NIF readers of
# game-archive input (BSA/BA2/CSG, BGSM/BGEM, Starfield CDB, Havok HKX,
# FaceGen, MenuXml). Their real-data suites are `#[ignore]`d too, so before this
# job nothing scheduled them anywhere and a regression in e.g. `Ba2Archive::open`
# stayed invisible until someone ran them by hand.
#
# #5088 — the same job also runs the scripting crate's ObScript quest-script
# corpus gate (M47.3): it was the only real-data guard over the 255 vanilla
# quest scripts, silently `return`ed green without Oblivion.esm even under
# `BYROREDUX_REQUIRE_GAME_DATA=1`, and no lane ever built the crate.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: Title to gate (all, or one)
        required: true
        default: all
        type: choice
        options:
          - all
          - oblivion
          - fo3
          - fnv
          - skyrim_le
          - skyrim_se
          - fo4
          - fo76
          - starfield
          - parsers

jobs:
  # #4619 — GitHub evaluates `jobs.<id>.if` before it expands the matrix, so a
  # job-level `if:` that reads `matrix.game` makes the whole file unparseable
  # (every push produced a 0-job failed run and nothing was ever scheduled).
  # The per-title selection is therefore done here, on a hosted runner, and
  # handed to `corpus` as a JSON matrix.
  select:
    name: select corpus titles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          GAME: ${{ inputs.game }}
          SKYRIMLE_DATA: ${{ vars.BYROREDUX_SKYRIMLE_DATA }}
        run: |
          set -euo pipefail
          # `env_var` / `data_dir` follow `crates/nif/tests/common/mod.rs`
          # (`Game::env_var` / `Game::default_path`); `filter` is the
          # space-separated set of libtest substrings (OR'd) covering that
          # title's `parse_rate_*`, `per_block_baseline_*` and
          # `unknown_ceiling_*` tests — including the `*_all_meshes` gates,
          # whose names use the short `fo4` / `fo76` spelling.
          rows='[
            {"game":"oblivion","env_var":"BYROREDUX_OBLIVION_DATA","data_dir":"Oblivion/Data","filter":"oblivion"},
            {"game":"fo3","env_var":"BYROREDUX_FO3_DATA","data_dir":"Fallout 3 goty/Data","filter":"fallout_3"},
            {"game":"fnv","env_var":"BYROREDUX_FNV_DATA","data_dir":"Fallout New Vegas/Data","filter":"fallout_nv"},
            {"game":"skyrim_le","env_var":"BYROREDUX_SKYRIMLE_DATA","data_dir":"","filter":"skyrim_le"},
            {"game":"skyrim_se","env_var":"BYROREDUX_SKYRIMSE_DATA","data_dir":"Skyrim Special Edition/Data","filter":"skyrim_se"},
            {"game":"fo4","env_var":"BYROREDUX_FO4_DATA","data_dir":"Fallout 4/Data","filter":"fallout_4 fo4_all_meshes"},
            {"game":"fo76","env_var":"BYROREDUX_FO76_DATA","data_dir":"Fallout76/Data","filter":"fallout_76 fo76_all_meshes"},
            {"game":"starfield","env_var":"BYROREDUX_STARFIELD_DATA","data_dir":"Starfield/Data","filter":"starfield"}
          ]'
          if [ "${EVENT}" = "schedule" ] || [ "${GAME}" = "all" ]; then
            want=all
          else
            want="${GAME}"
          fi
          # The 2011 Skyrim release is not a Steam-root install (it lives in a
          # Wine prefix on the reference machine), so its path comes from its
          # own variable. Named, not silent, when that variable is unset.
          if [ -z "${SKYRIMLE_DATA}" ]; then
            echo "::warning::BYROREDUX_SKYRIMLE_DATA is unset; skipping the skyrim_le corpus gates"
            rows=$(jq -c 'map(select(.game != "skyrim_le"))' <<<"${rows}")
          fi
          matrix=$(jq -c --arg want "${want}" \
            'map(select($want == "all" or .game == $want))' <<<"${rows}")
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "selected: ${matrix}"

  corpus:
    name: ${{ matrix.game }} corpus gates
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: [self-hosted, linux, x64, byroredux-game-data]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the ${{ matrix.game }} corpus gates
        env:
          GAME: ${{ matrix.game }}
          ENV_VAR: ${{ matrix.env_var }}
          DATA_DIR: ${{ matrix.game == 'skyrim_le' && vars.BYROREDUX_SKYRIMLE_DATA || format('{0}/{1}', vars.BYROREDUX_GAMES_ROOT, matrix.data_dir) }}
          FILTER: ${{ matrix.filter }}
          # #3850 — an absent corpus panics the resolver instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          # Env keys cannot be expressions, so the per-title data-dir variable
          # is exported here from the matrix row.
          export "${ENV_VAR}=${DATA_DIR}"
          echo "${ENV_VAR}=${DATA_DIR}"
          mkdir -p target/real-data-gates
          log="target/real-data-gates/${GAME}.log"
          # FILTER is a space-separated list; libtest ORs positional filters.
          read -r -a filters <<<"${FILTER}"
          cargo test --release -p byroredux-nif \
            --test parse_real_nifs \
            --test per_block_baselines \
            --test block_coverage_baselines \
            -- --ignored --test-threads=1 --nocapture "${filters[@]}" 2>&1 | tee "${log}"
          # libtest treats a filter that matches nothing as a green no-op —
          # refuse that the same way #3850 refuses a data-less green.
          ran=$(grep -c '^test .* \.\.\. ok$' "${log}" || true)
          if [ "${ran}" -eq 0 ]; then
            echo "::error::no corpus gate matched filter '${FILTER}' for ${GAME}"
            exit 1
          fi
          echo "${ran} corpus gate(s) ran for ${GAME}"
      - name: Publish gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-gates-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/real-data-gates
          if-no-files-found: error
          retention-days: 30

  parsers:
    name: parser real-data suites
    if: github.event_name == 'schedule' || inputs.game == 'all' || inputs.game == 'parsers'
    runs-on: [self-hosted, linux, x64, byroredux-game-data]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run each parser crate's real-data suite
        env:
          GAMES_ROOT: ${{ vars.BYROREDUX_GAMES_ROOT }}
          # The 2011 Skyrim release is not a Steam-root install (it lives in a
          # Wine prefix on the reference machine), so it has its own variable.
          SKYRIMLE_DATA: ${{ vars.BYROREDUX_SKYRIMLE_DATA }}
          # #3850 — an absent install or archive fails instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          # Same per-title directories as the corpus matrix above; every one
          # of the six crates reads a subset of them.
          export BYROREDUX_OBLIVION_DATA="${GAMES_ROOT}/Oblivion/Data"
          export BYROREDUX_FO3_DATA="${GAMES_ROOT}/Fallout 3 goty/Data"
          export BYROREDUX_FNV_DATA="${GAMES_ROOT}/Fallout New Vegas/Data"
          export BYROREDUX_SKYRIMSE_DATA="${GAMES_ROOT}/Skyrim Special Edition/Data"
          export BYROREDUX_FO4_DATA="${GAMES_ROOT}/Fallout 4/Data"
          export BYROREDUX_FO76_DATA="${GAMES_ROOT}/Fallout76/Data"
          export BYROREDUX_STARFIELD_DATA="${GAMES_ROOT}/Starfield/Data"
          skip=()
          if [ -n "${SKYRIMLE_DATA}" ]; then
            export BYROREDUX_SKYRIMLE_DATA="${SKYRIMLE_DATA}"
          else
            # Named, not silent: the one test that needs Skyrim LE is left out
            # explicitly rather than failing the strict lane on every run.
            echo "::warning::BYROREDUX_SKYRIMLE_DATA is unset; skipping the hkx LE/SE parity test"
            skip=(--skip skyrim_le_packfiles_decode_to_the_same_rig_and_clips_as_se)
          fi
          mkdir -p target/real-data-gates
          failed=0
          for crate in bsa bgsm sfmaterial hkx facegen menuxml; do
            log="target/real-data-gates/parsers-${crate}.log"
            if ! cargo test --release -p "byroredux-${crate}" \
                -- --ignored --test-threads=1 --nocapture "${skip[@]}" 2>&1 | tee "${log}"; then
              echo "::error::byroredux-${crate} real-data suite failed"
              failed=1
              continue
            fi
            # Refuse a green no-op, as the corpus job does. Summed from the
            # per-binary summaries: under --nocapture a test's own output can
            # split its `test ... ok` line.
            ran=$(grep -oE 'test result: ok\. [0-9]+ passed' "${log}" | awk '{n += $4} END {print n + 0}')
            if [ "${ran}" -eq 0 ]; then
              echo "::error::no real-data test ran for byroredux-${crate}"
              failed=1
            else
              echo "${ran} real-data test(s) ran for byroredux-${crate}"
            fi
          done
          exit "${failed}"
      # #5088 — the M47.3 ObScript quest-script corpus gate. Scoped to the
      # named test (~160 MB resident): unlike the six parser crates above,
      # the scripting crate's heavier real-data work lives in the `plugin`
      # crate's `--ignored` suite, which stays out of this lane.
      - name: Run the ObScript quest-script corpus gate (scripting crate)
        env:
          GAMES_ROOT: ${{ vars.BYROREDUX_GAMES_ROOT }}
          # #3850 — an absent corpus fails instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          export BYROREDUX_OBLIVION_DATA="${GAMES_ROOT}/Oblivion/Data"
          mkdir -p target/real-data-gates
          log="target/real-data-gates/parsers-scripting.log"
          cargo test --release -p byroredux-scripting --lib \
            vanilla_oblivion_quest_scripts_execute_and_setstage \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee "${log}"
          # Refuse a green no-op, as the loop above does.
          ran=$(grep -oE 'test result: ok\. [0-9]+ passed' "${log}" | awk '{n += $4} END {print n + 0}')
          if [ "${ran}" -eq 0 ]; then
            echo "::error::the ObScript quest-script gate did not run for byroredux-scripting"
            exit 1
          fi
          echo "${ran} ObScript quest-script gate(s) ran for byroredux-scripting"
      - name: Publish gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-gates-parsers-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/real-data-gates
          if-no-files-found: error
          retention-days: 30
