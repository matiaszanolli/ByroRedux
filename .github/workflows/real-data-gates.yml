name: Real-data corpus gates

# #3919 — `ci.yml` runs `cargo test --workspace`, which never executes an
# `#[ignore]`d test, and the three NIF corpus harnesses that catch a vanilla-
# content parse regression (`parse_real_nifs`, `per_block_baselines`,
# `block_coverage_baselines`) are all `#[ignore]`d because they need game data.
# #3918 dropped 296 `NiSkinPartition` blocks across two shipped titles and sat
# on `main` for two days with CI green; the gate that would have named the
# exact block and delta was never invoked. This lane runs those harnesses
# nightly on the self-hosted runner that carries game data, one job per title
# so a red result names the game, with `BYROREDUX_REQUIRE_GAME_DATA=1` (#3850)
# so an absent corpus is a failed job rather than a silent `ok`, and a post-run
# check that the title's filter matched at least one test.
#
# #4659 — the `parsers` job generalises the same gate to the non-NIF readers of
# game-archive input (BSA/BA2/CSG, BGSM/BGEM, Starfield CDB, Havok HKX,
# FaceGen, MenuXml). Their real-data suites are `#[ignore]`d too, so before this
# job nothing scheduled them anywhere and a regression in e.g. `Ba2Archive::open`
# stayed invisible until someone ran them by hand.
#
# #5088 — the same job also runs the scripting crate's ObScript quest-script
# corpus gate (M47.3): it was the only real-data guard over the 255 vanilla
# quest scripts, silently `return`ed green without Oblivion.esm even under
# `BYROREDUX_REQUIRE_GAME_DATA=1`, and no lane ever built the crate.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: Title to gate (all, or one)
        required: true
        default: all
        type: choice
        options:
          - all
          - oblivion
          - fo3
          - fnv
          - skyrim_le
          - skyrim_se
          - fo4
          - fo76
          - starfield
          - parsers
          - pins

jobs:
  # #4619 — GitHub evaluates `jobs.<id>.if` before it expands the matrix, so a
  # job-level `if:` that reads `matrix.game` makes the whole file unparseable
  # (every push produced a 0-job failed run and nothing was ever scheduled).
  # The per-title selection is therefore done here, on a hosted runner, and
  # handed to `corpus` as a JSON matrix.
  select:
    name: select corpus titles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          GAME: ${{ inputs.game }}
          SKYRIMLE_DATA: ${{ vars.BYROREDUX_SKYRIMLE_DATA }}
        run: |
          set -euo pipefail
          # `env_var` / `data_dir` follow `crates/nif/tests/common/mod.rs`
          # (`Game::env_var` / `Game::default_path`); `filter` is the
          # space-separated set of libtest substrings (OR'd) covering that
          # title's `parse_rate_*`, `per_block_baseline_*` and
          # `unknown_ceiling_*` tests — including the `*_all_meshes` gates,
          # whose names use the short `fo4` / `fo76` spelling.
          rows='[
            {"game":"oblivion","env_var":"BYROREDUX_OBLIVION_DATA","data_dir":"Oblivion/Data","filter":"oblivion"},
            {"game":"fo3","env_var":"BYROREDUX_FO3_DATA","data_dir":"Fallout 3 goty/Data","filter":"fallout_3"},
            {"game":"fnv","env_var":"BYROREDUX_FNV_DATA","data_dir":"Fallout New Vegas/Data","filter":"fallout_nv"},
            {"game":"skyrim_le","env_var":"BYROREDUX_SKYRIMLE_DATA","data_dir":"","filter":"skyrim_le"},
            {"game":"skyrim_se","env_var":"BYROREDUX_SKYRIMSE_DATA","data_dir":"Skyrim Special Edition/Data","filter":"skyrim_se"},
            {"game":"fo4","env_var":"BYROREDUX_FO4_DATA","data_dir":"Fallout 4/Data","filter":"fallout_4 fo4_all_meshes"},
            {"game":"fo76","env_var":"BYROREDUX_FO76_DATA","data_dir":"Fallout76/Data","filter":"fallout_76 fo76_all_meshes"},
            {"game":"starfield","env_var":"BYROREDUX_STARFIELD_DATA","data_dir":"Starfield/Data","filter":"starfield"}
          ]'
          if [ "${EVENT}" = "schedule" ] || [ "${GAME}" = "all" ]; then
            want=all
          else
            want="${GAME}"
          fi
          # The 2011 Skyrim release is not a Steam-root install (it lives in a
          # Wine prefix on the reference machine), so its path comes from its
          # own variable. Named, not silent, when that variable is unset.
          if [ -z "${SKYRIMLE_DATA}" ]; then
            echo "::warning::BYROREDUX_SKYRIMLE_DATA is unset; skipping the skyrim_le corpus gates"
            rows=$(jq -c 'map(select(.game != "skyrim_le"))' <<<"${rows}")
          fi
          matrix=$(jq -c --arg want "${want}" \
            'map(select($want == "all" or .game == $want))' <<<"${rows}")
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "selected: ${matrix}"

  corpus:
    name: ${{ matrix.game }} corpus gates
    needs: select
    if: needs.select.outputs.matrix != '[]'
    runs-on: [self-hosted, linux, x64, byroredux-game-data]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # #5308 / #5478 — rust-toolchain.toml pins 1.96.0 and overrides
      # this step inside the checkout; naming the same toolchain here
      # keeps the version output truthful instead of installing an
      # unused stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run the ${{ matrix.game }} corpus gates
        env:
          GAME: ${{ matrix.game }}
          ENV_VAR: ${{ matrix.env_var }}
          DATA_DIR: ${{ matrix.game == 'skyrim_le' && vars.BYROREDUX_SKYRIMLE_DATA || format('{0}/{1}', vars.BYROREDUX_GAMES_ROOT, matrix.data_dir) }}
          FILTER: ${{ matrix.filter }}
          # #3850 — an absent corpus panics the resolver instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          # Env keys cannot be expressions, so the per-title data-dir variable
          # is exported here from the matrix row.
          export "${ENV_VAR}=${DATA_DIR}"
          echo "${ENV_VAR}=${DATA_DIR}"
          mkdir -p target/real-data-gates
          log="target/real-data-gates/${GAME}.log"
          # FILTER is a space-separated list; libtest ORs positional filters.
          read -r -a filters <<<"${FILTER}"
          # #5660 — --no-fail-fast: a red binary must not stop the ones after
          # it (cargo otherwise skips the remaining test targets silently).
          cargo test --release --no-fail-fast -p byroredux-nif \
            --test parse_real_nifs \
            --test per_block_baselines \
            --test block_coverage_baselines \
            -- --ignored --test-threads=1 --nocapture "${filters[@]}" 2>&1 | tee "${log}"
          # libtest treats a filter that matches nothing as a green no-op —
          # refuse that the same way #3850 refuses a data-less green.
          ran=$(grep -c '^test .* \.\.\. ok$' "${log}" || true)
          if [ "${ran}" -eq 0 ]; then
            echo "::error::no corpus gate matched filter '${FILTER}' for ${GAME}"
            exit 1
          fi
          echo "${ran} corpus gate(s) ran for ${GAME}"
      - name: Publish gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-gates-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/real-data-gates
          if-no-files-found: error
          retention-days: 30

  parsers:
    name: parser real-data suites
    if: github.event_name == 'schedule' || inputs.game == 'all' || inputs.game == 'parsers'
    runs-on: [self-hosted, linux, x64, byroredux-game-data]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # #5308 / #5478 — rust-toolchain.toml pins 1.96.0 and overrides
      # this step inside the checkout; naming the same toolchain here
      # keeps the version output truthful instead of installing an
      # unused stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run each parser crate's real-data suite
        env:
          GAMES_ROOT: ${{ vars.BYROREDUX_GAMES_ROOT }}
          # The 2011 Skyrim release is not a Steam-root install (it lives in a
          # Wine prefix on the reference machine), so it has its own variable.
          SKYRIMLE_DATA: ${{ vars.BYROREDUX_SKYRIMLE_DATA }}
          # #3850 — an absent install or archive fails instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          # Same per-title directories as the corpus matrix above; every one
          # of the six crates reads a subset of them.
          export BYROREDUX_OBLIVION_DATA="${GAMES_ROOT}/Oblivion/Data"
          export BYROREDUX_FO3_DATA="${GAMES_ROOT}/Fallout 3 goty/Data"
          export BYROREDUX_FNV_DATA="${GAMES_ROOT}/Fallout New Vegas/Data"
          export BYROREDUX_SKYRIMSE_DATA="${GAMES_ROOT}/Skyrim Special Edition/Data"
          export BYROREDUX_FO4_DATA="${GAMES_ROOT}/Fallout 4/Data"
          export BYROREDUX_FO76_DATA="${GAMES_ROOT}/Fallout76/Data"
          export BYROREDUX_STARFIELD_DATA="${GAMES_ROOT}/Starfield/Data"
          skip=()
          if [ -n "${SKYRIMLE_DATA}" ]; then
            export BYROREDUX_SKYRIMLE_DATA="${SKYRIMLE_DATA}"
          else
            # Named, not silent: the one test that needs Skyrim LE is left out
            # explicitly rather than failing the strict lane on every run.
            echo "::warning::BYROREDUX_SKYRIMLE_DATA is unset; skipping the hkx LE/SE parity test"
            skip=(--skip skyrim_le_packfiles_decode_to_the_same_rig_and_clips_as_se)
          fi
          mkdir -p target/real-data-gates
          failed=0
          for crate in bsa bgsm sfmaterial hkx facegen menuxml; do
            log="target/real-data-gates/parsers-${crate}.log"
            # #5660 — --no-fail-fast: without it a failing test binary stops
            # cargo before the crate's later ones (a red bsa_real hid
            # csg_real), and a known failure masks every regression behind it.
            if ! cargo test --release --no-fail-fast -p "byroredux-${crate}" \
                -- --ignored --test-threads=1 --nocapture "${skip[@]}" 2>&1 | tee "${log}"; then
              echo "::error::byroredux-${crate} real-data suite failed"
              failed=1
              continue
            fi
            # Refuse a green no-op, as the corpus job does. Summed from the
            # per-binary summaries: under --nocapture a test's own output can
            # split its `test ... ok` line.
            ran=$(grep -oE 'test result: ok\. [0-9]+ passed' "${log}" | awk '{n += $4} END {print n + 0}')
            if [ "${ran}" -eq 0 ]; then
              echo "::error::no real-data test ran for byroredux-${crate}"
              failed=1
            else
              echo "${ran} real-data test(s) ran for byroredux-${crate}"
            fi
          done
          exit "${failed}"
      # #5088 — the M47.3 ObScript quest-script corpus gate. Scoped to the
      # named test (~160 MB resident): unlike the six parser crates above,
      # the scripting crate's heavier real-data work lives in the `plugin`
      # crate's `--ignored` suite, which stays out of this lane.
      - name: Run the ObScript quest-script corpus gate (scripting crate)
        env:
          GAMES_ROOT: ${{ vars.BYROREDUX_GAMES_ROOT }}
          # #3850 — an absent corpus fails instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          export BYROREDUX_OBLIVION_DATA="${GAMES_ROOT}/Oblivion/Data"
          mkdir -p target/real-data-gates
          log="target/real-data-gates/parsers-scripting.log"
          cargo test --release -p byroredux-scripting --lib \
            vanilla_oblivion_quest_scripts_execute_and_setstage \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee "${log}"
          # Refuse a green no-op, as the loop above does.
          ran=$(grep -oE 'test result: ok\. [0-9]+ passed' "${log}" | awk '{n += $4} END {print n + 0}')
          if [ "${ran}" -eq 0 ]; then
            echo "::error::the ObScript quest-script gate did not run for byroredux-scripting"
            exit 1
          fi
          echo "${ran} ObScript quest-script gate(s) ran for byroredux-scripting"
      - name: Publish gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-gates-parsers-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/real-data-gates
          if-no-files-found: error
          retention-days: 30

  # #5799 — 218 of the 322 ignored tests ran in no automated lane, and 48 of
  # those pin fixes for closed HIGH/CRITICAL issues (the #5005 corpse rule,
  # #5228 precombine rebake, #5238 actor-value curve, #5243 per-cell distant
  # water, #5487 skeletons, #2908/#2910 decode rates, ...). Each of those
  # regressions would resurface silently: the pins are real-data tests, CI
  # never executes `#[ignore]`d tests, and the hand-run `--ignored` filter
  # only happens when an audit remembers. The plugin crate's whole-suite run
  # stays out of the lane deliberately (one `parse_real_esm.rs` process loads
  # every master and spikes past 20 GB) — running each title in its own
  # process loads one master at a time, which is the scoped alternative that
  # objection was waiting for.
  closed-high-pins:
    name: closed-HIGH real-data pins
    if: github.event_name == 'schedule' || inputs.game == 'all' || inputs.game == 'pins'
    runs-on: [self-hosted, linux, x64, byroredux-game-data]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run every closed-HIGH/CRITICAL real-data pin, one process per title
        env:
          GAMES_ROOT: ${{ vars.BYROREDUX_GAMES_ROOT }}
          SKYRIMLE_DATA: ${{ vars.BYROREDUX_SKYRIMLE_DATA }}
          # #3850 — an absent install fails instead of skipping.
          BYROREDUX_REQUIRE_GAME_DATA: "1"
        run: |
          set -euo pipefail
          export BYROREDUX_OBLIVION_DATA="${GAMES_ROOT}/Oblivion/Data"
          export BYROREDUX_FO3_DATA="${GAMES_ROOT}/Fallout 3 goty/Data"
          export BYROREDUX_FNV_DATA="${GAMES_ROOT}/Fallout New Vegas/Data"
          export BYROREDUX_SKYRIMSE_DATA="${GAMES_ROOT}/Skyrim Special Edition/Data"
          export BYROREDUX_FO4_DATA="${GAMES_ROOT}/Fallout 4/Data"
          export BYROREDUX_FO76_DATA="${GAMES_ROOT}/Fallout76/Data"
          export BYROREDUX_STARFIELD_DATA="${GAMES_ROOT}/Starfield/Data"
          if [ -n "${SKYRIMLE_DATA}" ]; then
            export BYROREDUX_SKYRIMLE_DATA="${SKYRIMLE_DATA}"
          fi
          # One line per pin: "<lane> <test title>". The lane names the cargo
          # target; the title is a substring filter (libtest ORs nothing —
          # each process runs exactly one pin, which is the memory bound).
          # New closed-HIGH pins append here (the lane refuses a green no-op,
          # so a typo'd title fails rather than passing vacuously).
          pins=(
            # plugin lib (records / actor / cell integration)
            "plugin-lib fallout3_ruleset_resolves_against_the_real_master"
            "plugin-lib falloutnv_ruleset_resolves_against_the_real_master"
            "plugin-lib fallout4_ruleset_resolves_against_the_real_master"
            "plugin-lib skyrim_ruleset_resolves_against_the_real_master"
            "plugin-lib skyrim_bodt_body_templates_decode_their_biped_masks"
            "plugin-lib parse_real_fnv_dial_infos_populated"
            "plugin-lib parse_real_fo4_dialogues_and_scenes_populated"
            "plugin-lib parse_real_starfield_dialogues_and_scenes_populated"
            "plugin-lib parse_real_fnv_race_head_parts_exclude_the_body_section"
            "plugin-lib parse_real_fo3_megaton_cell_baseline"
            "plugin-lib parse_real_skyrim_esm"
            "plugin-lib merge_real_dawnguard_partial_cells_preserves_skyrim_landscape"
            "plugin-lib parse_real_fo4_esm_surfaces_scol_placements"
            "plugin-lib parse_real_fo4_esm_surfaces_pkin_contents"
            "plugin-lib parse_real_oblivion_esm_surfaces_tamriel_worldspace"
            "plugin-lib parse_real_fo3_esm_surfaces_wasteland_worldspace"
            # plugin parse_real_esm integration harness
            "plugin-esm fnv_corpses_key_on_base_health_not_xrgd"
            "plugin-esm fo4_starts_unconscious_and_xrgd_poses_match_the_census"
            "plugin-esm skyrim_xrgd_poses_match_the_census_and_nothing_is_unconscious"
            "plugin-esm fo4_pkin_cnam_targets_are_template_cells"
            "plugin-esm fallout3_dial_topic_flags_census"
            "plugin-esm fnv_karma_good_global_decodes_float_payload_before_narrowing"
            "plugin-esm oblivion_spawn_time_global_decodes_float_payload_before_narrowing"
            "plugin-esm fnv_actor_value_roster_and_health_resolve_on_shipped_master"
            "plugin-esm fnv_armo_female_meshes_are_parsed_and_selected"
            "plugin-esm parse_rate_oblivion_esm"
            "plugin-esm clas_oblivion_knight_against_vanilla"
            "plugin-esm parse_rate_fnv_pack_pldt_location"
            "plugin-esm installed_masters_per_water_scalars_are_not_decoded_constants"
            "plugin-esm fnv_leveled_item_multi_pick_semantics_are_pinned_on_the_shipped_master"
            "plugin-esm skyrim_leveled_item_multi_pick_semantics_are_pinned_on_the_shipped_master"
            # byroredux bin (inventory / asset provider / npc spawn / cell loader)
            "bin installed_fnv_player_base_builds_a_nonempty_template"
            "bin facegen_tool_path_resolves_via_basename_fallback"
            "bin nested_draugr_template_resolves_traits_on_real_skyrim_data"
            "bin race_skeletons_match_authored_paths_on_real_skyrim_data"
            "bin installed_oblivion_body_paths_exist_in_the_meshes_archive"
            "bin installed_fnv_sunny_smiles_selects_the_female_body"
            "bin installed_oblivion_creature_assets_resolve_from_their_records"
            "bin bannered_mare_npcs_resolve_a_full_equip_state_on_real_skyrim_data"
            "bin creature_race_npcs_keep_their_skin_mesh_on_real_skyrim_data"
            "bin helmeted_npcs_get_a_facegen_hide_mask_on_real_skyrim_data"
            "bin bannered_mare_outfits_keep_every_inam_entry_on_real_skyrim_data"
            "bin distant_water_mesh_is_per_cell_on_real_fnv"
            "bin dlc_rebake_of_a_master_owned_cell_decodes_from_the_dlc_csg"
            "bin exterior_precombine_instances_are_world_absolute"
            "bin riverwater_flowne_real_record_layers_run_downstream"
            # #5784 — Dim 3 real-data tests whose names carry no game token,
            # so no corpus substring filter reaches them.
            "bin dark_texture_role_population_matches_the_documented_census"
            "bin real_archive_torch_meshes_surface_particle_emitters"
            # nif whole-corpus harnesses that cite closed-HIGH fixes but sit
            # outside the three binaries the corpus job names
            "nif-corpus lod_and_facegen_geometry_no_longer_imports_flat"
            "nif-corpus cross_game_translation_completeness"
          )
          mkdir -p target/real-data-gates
          failed=0
          for pin in "${pins[@]}"; do
            lane="${pin%% *}"
            title="${pin#* }"
            case "${lane}" in
              plugin-lib) target="-p byroredux-plugin --lib" ;;
              plugin-esm) target="-p byroredux-plugin --test parse_real_esm" ;;
              bin) target="-p byroredux --bin byroredux" ;;
              nif-corpus) target="-p byroredux-nif --test normal_synthesis_corpus --test translation_completeness" ;;
            esac
            log="target/real-data-gates/pins-${title}.log"
            echo "::group::${title}"
            # shellcheck disable=SC2086 — ${target} is a word list by design.
            if ! cargo test --release --no-fail-fast ${target} "${title}"                 -- --ignored --test-threads=1 --nocapture 2>&1 | tee "${log}"; then
              echo "::endgroup::"
              echo "::error::closed-HIGH pin '${title}' failed"
              failed=1
              continue
            fi
            echo "::endgroup::"
            # Refuse the green no-op, as every other job in this lane does.
            ran_ok=$(grep -cE '^test .* \.\.\. ok$' "${log}" || true)
            if [ "${ran_ok}" -eq 0 ]; then
              echo "::error::closed-HIGH pin '${title}' matched nothing (green no-op)"
              failed=1
            else
              echo "pin '${title}': ${ran_ok} test(s) ran"
            fi
          done
          if [ "${failed}" -eq 0 ]; then
            echo "all ${#pins[@]} closed-HIGH pins green"
          fi
          exit "${failed}"
      - name: Publish pin logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-pins-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/real-data-gates
          if-no-files-found: error
          retention-days: 30
