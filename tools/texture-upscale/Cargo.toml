[package]
name = "byro-texture-upscale"
version.workspace = true
edition.workspace = true

[[bin]]
name = "byro-texture-upscale"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
byroredux-bsa = { workspace = true }
clap = { workspace = true }
# Source textures come in as dds/png/tga/bmp/jpg|jpeg (see
# `accepted_source_extension` in src/lib.rs) — the workspace base only
# carries png, so name the rest here.
image = { workspace = true, features = ["bmp", "dds", "jpeg", "tga"] }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true, features = ["disk"] }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
